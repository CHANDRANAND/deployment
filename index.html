<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab Report System</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- Single bundled file on purpose: opening index.html straight out of
         a zip/rar (e.g. double-clicking inside a WinRAR window) often only
         extracts the one clicked file, not nested subfolders like js/ — that
         silently breaks a multi-file <script src="js/..."> setup. One file
         removes that failure mode. It's still organized into the same
         module sections (see the banner comments inside app.js). -->
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <div class="app-shell auth-locked">
      <header class="topbar">
        <div class="brand-block">
          <div class="brand-mark">LR</div>
          <div>
            <h1>Arun Clinical Lab</h1>
            <p>Diagnostics & pathology reporting</p>
          </div>
        </div>

        <nav class="topnav">
          <button class="nav-pill active" data-nav="editor">Report Editor</button>
          <button class="nav-pill" data-nav="history">History</button>
          <button class="nav-pill" data-nav="templates">Templates</button>
          <button class="nav-pill" data-nav="settings">Settings</button>
          <button class="nav-pill" data-nav="payments">Payments</button>
        </nav>

        <button class="ghost-btn" id="saveBtn">Save</button>
      </header>

      <div class="tabbar-row">
        <div class="tabbar" id="tabBar"></div>
        <button class="secondary-btn" id="printBtn">Print preview</button>
      </div>

      <main class="content-grid">
        <section class="editor-card">
          <div id="editorContent"></div>
        </section>

        <aside class="sidebar">
          <div class="card actions-card">
            <div class="card-title">Quick actions</div>
            <button class="primary-btn" id="addRowBtn">Select tests</button>
          </div>

          <div class="card" id="testSectionsCard" style="display:none;">
            <div id="testSectionsPanel"></div>
          </div>
        </aside>
      </main>
    </div>

    <div class="toast" id="toast"></div>

    <div class="auth-overlay" id="authOverlay">
      <div class="auth-panel">
        <div class="brand-mark" id="authBrandMark">LR</div>
        <h2>Arun Clinical Lab</h2>
        <p class="auth-kicker">Secure laboratory workspace</p>
        <p class="muted-text" id="authDescription">Sign in to access your reports and payments.</p>
        <form id="authForm">
          <div class="field-group" id="authEmailGroup"><label>Email</label><input id="authEmail" type="email" autocomplete="email" required /></div>
          <div class="field-group" id="authPasswordGroup"><label>Password</label><input id="authPassword" type="password" autocomplete="current-password" minlength="6" /></div>
          <div class="field-group hidden-field" id="authMpinGroup"><label id="authMpinLabel">MPIN</label><input id="authMpin" type="password" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{4,6}" minlength="4" maxlength="6" /></div>
          <div class="auth-media-group hidden-field" id="authMediaGroup">
            <label class="background-upload"><span>Lab logo</span><input id="authLogoInput" type="file" accept="image/*" /><small>Optional PNG or JPG</small></label>
            <label class="background-upload"><span>Login background</span><input id="authBackgroundInput" type="file" accept="image/*" /><small>Use your lab branding image</small></label>
          </div>
          <button class="primary-btn auth-submit" id="authSubmitBtn" type="submit">Sign in</button>
        </form>
        <button class="ghost-btn auth-toggle" id="authToggleBtn" type="button">Create an account</button>
        <p class="auth-error" id="authError" role="alert"></p>
      </div>
    </div>

    <div class="preview-overlay hidden" id="previewOverlay">
      <div class="preview-panel">
        <header class="preview-header">
          <div>
            <h2>Print Preview</h2>
            <p class="muted-text">Review the report layout before printing.</p>
          </div>
          <div class="preview-actions">
            <button class="ghost-btn" id="closePreviewBtn">Close</button>
            <button class="secondary-btn" id="exportPdfBtn">Export PDF</button>
            <button class="primary-btn" id="printNowBtn">Print</button>
          </div>
        </header>
        <div class="preview-body" id="previewBody"></div>
      </div>
    </div>
  </body>
</html>
